# WiFi station layer, any ESP32 board: west build -- -DEXTRA_CONF_FILE="prj_wifi.conf;prj_wifi.local.conf"
# IPv4 only: the VM's sockets take the build's family (AF_INET here, AF_INET6 under Thread).
# The porta agent is prj_agent.conf, added to EXTRA_CONF_FILE.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ZVFS_EVENTFD=y
CONFIG_ZVFS_POLL_MAX=9
CONFIG_ZVFS_OPEN_MAX=9
# The network's SSID/PSK: one entry in the settings store, written by the flashing tool (#30).
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=1
# The WiFi credentials, and the agent's records when prj_agent.conf is added.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
