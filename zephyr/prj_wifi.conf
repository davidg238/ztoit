# WiFi station layer, any ESP32 board: west build -- -DEXTRA_CONF_FILE="prj_wifi.conf;prj_wifi.local.conf"
# IPv4 only: the VM's sockets take the build's family (AF_INET here, AF_INET6 under Thread). The CoAP client is for the porta agent (rete #521).
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ZVFS_EVENTFD=y
CONFIG_ZVFS_POLL_MAX=9
CONFIG_ZVFS_OPEN_MAX=9
CONFIG_COAP=y
CONFIG_COAP_CLIENT=y
# The C agent (rete #521): porta's address goes in prj_wifi.local.conf.
CONFIG_TOIT_AGENT=y
# The network's SSID/PSK: one entry in the settings store, written by the flashing tool (#30).
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=1
# The agent's boot counter and the WiFi credentials.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
# One reply datagram: porta caps a #batch at 512 B (space.MaxBatchBytes) and runs blockwise off.
CONFIG_COAP_CLIENT_MESSAGE_SIZE=576
