# WiFi station layer, any ESP32 board: west build -- -DEXTRA_CONF_FILE="prj_wifi.conf;prj_wifi.local.conf"
# IPv4 only: the VM's sockets take the build's family (AF_INET here, AF_INET6 under Thread). The CoAP client is for the porta agent (rete #521).
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ZVFS_EVENTFD=y
CONFIG_ZVFS_POLL_MAX=9
CONFIG_ZVFS_OPEN_MAX=9
CONFIG_COAP=y
CONFIG_COAP_CLIENT=y
