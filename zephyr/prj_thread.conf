# Thread (OpenThread MTD) layer, any board: west build -- -DEXTRA_CONF_FILE="prj_thread.conf;prj_thread.local.conf"
#   (the radio driver follows the board devicetree: zephyr/boards/*.overlay)
# Values follow rete's proven C6 layer (rete nodus/oevm/zephyr/prj_esp32c6_thread.conf).
# The real porta dataset (network key) lives in the gitignored prj_thread.local.conf;
# without it the node builds but does not join. Read the live dataset with
#   ssh gw85224-01 docker exec otbr ot-ctl dataset active
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_IEEE802154=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n
CONFIG_OPENTHREAD_MANUAL_START=y
# SLAAC gives the node an address on the OTBR's off-mesh-routable (OMR) prefix,
# which source selection needs for any destination beyond the mesh.
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6240
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
# The TX pool also sizes TCP's send window (count x 128 B / 3, zephyr tcp.c
# tcp_tx_window). At 16 a 1000 B write is accepted and never sent (the gateway
# saw 117 B); at 64 (window 2730) tcp_echo.toit passes 5/5 (ztoit#4).
CONFIG_NET_BUF_TX_COUNT=64
# OpenThread keeps its dataset in settings, on the board's `storage` partition.
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZVFS_EVENTFD=y
# The VM's socket event source polls up to MAX_FDS sockets plus its wake eventfd
# (toit src/event_sources/zsock_zephyr.h; static_assert there). At the defaults
# (poll 3, open 4) two network containers aborted with zsock_poll ENOMEM.
CONFIG_ZVFS_POLL_MAX=9
CONFIG_ZVFS_OPEN_MAX=9
# OpenThread's HMAC (key derivation) allocates from the mbedTLS heap it shares with the VM; at the
# default 512 B it fails once the VM's EntropyMixer holds a hash context (#19).
CONFIG_MBEDTLS_HEAP_SIZE=2048
