# The Vindriktning on a WROOM-32 (#52): zephyr.Uart receives the sensor line.
#   west build -- -DEXTRA_CONF_FILE="prj_wifi.conf;prj_agent.conf;prj_vin.conf;prj_wifi.local.conf"
#     -DEXTRA_DTC_OVERLAY_FILE=vindriktning.overlay
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
# zephyr.Uart finds the UART by devicetree node label.
CONFIG_DEVICE_DT_METADATA=y
