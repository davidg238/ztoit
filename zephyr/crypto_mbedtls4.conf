# The VM core's crypto on Mbed TLS 4 / TF-PSA-Crypto (Zephyr 4.5): the legacy
# APIs the VM calls are private there (mbedtls/private/*.h, reached through
# modules/toit/mbedtls4/). PSA_WANT_* selects which legacy modules compile.
# modules/toit/Kconfig's TOIT selects the PSA_WANT_* the VM links. The
# `crypto` primitives (AES, GCM, ChaCha, ECDSA) are compiled out on Zephyr (no
# CONFIG_TOIT_CRYPTO).
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS=y
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y
# ECDSA/P-256 is the only route to bignum: TF-PSA's rsa.c fails -Werror with just
# the RSA public key.
# Bluetooth (prj_ble.conf) turns on the p256-m driver for its P-256, which replaces
# the built-in ECC above and with it bignum: the VM then fails to link (ztoit #41).
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
