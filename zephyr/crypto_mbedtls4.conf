# The VM core's crypto on Mbed TLS 4 / TF-PSA-Crypto (Zephyr 4.5): the legacy
# APIs the VM calls are private there (mbedtls/private/*.h, reached through
# modules/toit/mbedtls4/). PSA_WANT_* selects which legacy modules compile.
# Linked by the VM: bignum, SHA-256/512, entropy. The `crypto` primitives
# (AES, GCM, ChaCha, ECDSA) are compiled out on Zephyr (no CONFIG_TOIT_CRYPTO).
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS=y
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_512=y
# Only the route to bignum: TF-PSA's rsa.c fails -Werror with just the RSA public key.
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
