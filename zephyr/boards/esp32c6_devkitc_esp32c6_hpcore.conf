# Zephyr device classes behind Toit's `zephyr` primitives (#7). Drivers follow
# the overlay's devicetree: BMP180 (sensor, i2c), BOOT (input, gpio-keys), the
# DO (led, gpio-leds) and the RGB LED (led_strip, ws2812-i2s).
CONFIG_DEVICE_DT_METADATA=y
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_LED=y
CONFIG_LED_STRIP=y
CONFIG_I2S=y
CONFIG_DMA=y
