# WROOM-32 (rete #521 spike). The ESP32's DRAM is two banks: dram0 (192 KB:
# data, bss, and the C heap after them) and dram1 (96 KB: .noinit here). Thread
# stacks and the Toit arena go to dram1; dram0 is left to WiFi's 44 KB heap and
# the C heap, where Toit's thread stacks and GC metadata are malloc'd.
CONFIG_ESP32_REGION_1_NOINIT=y
CONFIG_TOIT_HEAP_NOINIT=y
# Fills what dram1 has left after the stacks (52 KB free, measured 2026-11-17).
CONFIG_TOIT_HEAP_SIZE=49152
# Toit's sha.cc links SHA-512.
CONFIG_MBEDTLS_SHA512=y
