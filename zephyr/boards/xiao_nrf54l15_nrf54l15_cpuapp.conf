# App region ends where toit_partition starts (boards/xiao_nrf54l15_nrf54l15_cpuapp.overlay).
CONFIG_FLASH_LOAD_SIZE=0xc2000
# Toit heap: the dongle's value as a starting point (256 KB RAM). Not tuned yet;
# rung 2 of ktau measures it.
CONFIG_TOIT_HEAP_SIZE=81920
# zephyr.Led: the board LED (gpio-leds led0) through Zephyr's LED API.
CONFIG_LED=y
