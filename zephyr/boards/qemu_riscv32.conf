# QEMU RISC-V 32 (virt): the Toit core test runs, no board needed (ztoit#61,
# tests/qemu, tools/test-qemu.py). 256 MB of RAM and no flash driver: the
# registry is RAM (flash_registry_zephyr.cc) sized for a few hundred test
# images, and the Toit heap for tests written for the host.
# Random numbers: the board turns on CONFIG_TEST_RANDOM_GENERATOR (its
# Kconfig.defconfig, with networking), a non-secure generator acceptable for
# this test build only. sys_csrand_get (crypto.random) still comes from the
# entropy driver, RISC-V Zkr, which QEMU feeds from the host's random source.
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_TOIT_RAM_REGISTRY_SIZE=33554432
CONFIG_TOIT_HEAP_SIZE=33554432
# One instruction per virtual ns, not the board's 64: a host-class CPU, so
# the runner's timeout means what upstream's does on the host. Networking
# turns icount off by default; sleep mode keeps it and lets virtual time pass
# at real speed while the guest idles, so a reply through slirp (host time)
# is not outrun by the guest's timeouts.
CONFIG_QEMU_ICOUNT=y
CONFIG_QEMU_ICOUNT_SHIFT=0
CONFIG_QEMU_ICOUNT_SLEEP=y
# Toit's crypto module (hashes, AES, AEAD, Blake2s, SipHash) for the crypto tests.
CONFIG_TOIT_CRYPTO=y
CONFIG_TOIT_CRYPTO_EXTRA=y
# An IP stack for the network tests: IPv4 (the VM's sockets take one family),
# loopback for the tests that talk to localhost, and QEMU's user networking
# (slirp: no root, no TAP) on the board's virtio-net for the outside world, at
# slirp's fixed guest address. net.open takes it as it is (TOIT_LINK_IP).
# The loopback driver costs outside TCP: an unbound TCP connect takes the
# source address by prefix over every interface (net_if_ipv4_select_src_addr,
# ties to the last), so a host that shares no more leading bits with 10.0.2.0
# than with 127.0.0.0 (any at 128.0.0.0 and above) gets 127.0.0.1: refused. Without it 127.0.0.1 cannot be bound, which more tests need.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_QEMU_USER=y
CONFIG_NET_DEFAULT_IF_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_TOIT_LINK_IP=y
# The zsock event source's eventfd, and room for the sockets a test opens.
CONFIG_ZVFS_EVENTFD=y
CONFIG_ZVFS_POLL_MAX=32
CONFIG_ZVFS_OPEN_MAX=40
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
# Toit's standard i2c library (#62) on the overlay's emulated controller and
# its AT24 EEPROM emulator (Zephyr's EEPROM driver must bind the node too).
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT2X_EMUL=y
