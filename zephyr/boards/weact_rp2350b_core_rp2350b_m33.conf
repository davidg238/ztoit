# WeAct RP2350B core (rete's out-of-tree board: -DBOARD_ROOT=<rete>/nodus/oevm/zephyr).
# Console on the SoC's USB (CDC ACM, overlay beside this file), as on rete's RP2350 builds.
CONFIG_FPU=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
# No Zephyr flash driver for the RP2350's QMI: the flash registry is RAM (programs not XIP).
CONFIG_TOIT_HEAP_SIZE=163840
# No entropy driver for the RP2350 in Zephyr 4.2: a NON-cryptographic generator, benchmark use only.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
