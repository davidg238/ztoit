# App region ends where toit_partition starts (boards/nrf52840dongle_nrf52840.overlay).
CONFIG_FLASH_LOAD_SIZE=0x9f000
# Toit heap. With Thread (prj_thread.conf) and the soak program, RAM is 71% used;
# the rest is the libc heap (thread stacks). Not tuned yet.
CONFIG_TOIT_HEAP_SIZE=81920
CONFIG_UART_LINE_CTRL=y
# OpenThread's radio transmit workqueue overflows its 512 B default on Zephyr 4.5
# (MPU fault in ot_radio_workq ~5 s after boot, FATAL_DUMP, #47).
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=1024
