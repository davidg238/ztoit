# UDP over Bluetooth LE to a phone relay (the Toit fork's udp_ble.cc; ztoit #41).
# Add with -DEXTRA_CONF_FILE=prj_ble.conf on a board with a BLE radio and no IP
# stack. The block is rete's nodus/oevm/zephyr/prj_dk_ble.conf, whose comments
# give each line's reason; the wire is rete's protocol/RELAY-BLE.md.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ztoit"
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# The bond lives in settings on the storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
