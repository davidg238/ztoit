# UDP over Bluetooth LE to a phone relay (the Toit fork's udp_ble.cc; ztoit #41).
# Add with -DEXTRA_CONF_FILE=prj_ble.conf on a board with a BLE radio and no IP
# stack. The block is rete's nodus/oevm/zephyr/prj_dk_ble.conf, whose comments
# give each line's reason; the wire is rete's protocol/RELAY-BLE.md.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ztoit"
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# The bond lives in settings on the storage partition. Without a backend Zephyr
# picks SETTINGS_NONE and the bond is RAM-only: lost at reset while the phone keeps
# it, so pairing times out (#41). ZMS selects SETTINGS_ZMS, the backend for the
# nRF54L's RRAM (rete's DK uses NVS on nRF52840 flash).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
# As rete's prj_dk_ble.conf: the Bluetooth host's work items run here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# Pairing's key exchange runs on the long workqueue. crypto_mbedtls4.conf turns
# p256-m off, so it runs on Mbed TLS's built-in ECP, which overflows the default
# stack (1400 B) at the first link (#41).
CONFIG_BT_LONG_WQ_STACK_SIZE=4096
# Ask the central for 7.5-15 ms, not Zephyr's 30-50 ms. The receive side grants one
# L2CAP credit at a time, so each 400 B datagram from the relay costs ~4-5 connection
# events: at 50 ms that is ~4 a second, too few for rung 6's 10 a second (#41).
# Costs radio power; we run on USB. Faster only while busy is #46.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
