# The C agent (porta check-ins and installs, nodus-toit design §5), on either link:
#   west build -- -DEXTRA_CONF_FILE="prj_wifi.conf;prj_agent.conf;prj_wifi.local.conf"
#   west build -- -DEXTRA_CONF_FILE="prj_thread.conf;prj_agent.conf;prj_thread.local.conf"
# The link's local conf sets CONFIG_TOIT_AGENT_PORTA (an address of the link's
# family) and CONFIG_TOIT_AGENT_PUBKEY (porta's pub key file; empty: nothing installs).
# Settings come from the link's conf (WiFi credentials, the OpenThread dataset).
CONFIG_TOIT_AGENT=y
CONFIG_COAP=y
CONFIG_COAP_CLIENT=y
# One reply datagram: porta caps a #batch at 512 B (space.MaxBatchBytes) and runs blockwise off.
CONFIG_COAP_CLIENT_MESSAGE_SIZE=576
